<script>

async function analyzeImage() {

    const input =
        document.getElementById("imageInput");

    const error =
        document.getElementById("error");

    const loading =
        document.getElementById("loading");

    const stats =
        document.getElementById("stats");

    const preview =
        document.getElementById("preview");

    error.textContent = "";
    stats.innerHTML = "";

    if (!input.files.length) {

        error.textContent =
            "Please select an image.";

        return;
    }

    loading.style.display = "block";

    try {

        const originalFile = input.files[0];

        /*
         * Convert AVIF/WebP/etc. to JPEG in the browser.
         * This prevents OpenCV from having to decode AVIF.
         */

        const imageBitmap =
            await createImageBitmap(originalFile);

        const canvas =
            document.createElement("canvas");

        canvas.width =
            imageBitmap.width;

        canvas.height =
            imageBitmap.height;

        const context =
            canvas.getContext("2d");

        context.drawImage(
            imageBitmap,
            0,
            0
        );

        const jpegBlob =
            await new Promise((resolve) => {

                canvas.toBlob(
                    resolve,
                    "image/jpeg",
                    0.95
                );

            });

        if (!jpegBlob) {

            throw new Error(
                "Could not convert image."
            );
        }

        const formData =
            new FormData();

        formData.append(
            "image",
            jpegBlob,
            "converted-image.jpg"
        );

        const response =
            await fetch(
                "/api/analyze",
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok || data.error) {

            throw new Error(
                data.error ||
                "OpenCV server returned an error."
            );
        }

        preview.src =
            "data:image/jpeg;base64," +
            data.image;

        preview.style.display =
            "block";

        stats.innerHTML = `
            <strong>Faces detected:</strong>
            ${data.faces_detected}
            <br>
            <strong>Eyes detected:</strong>
            ${data.eyes_detected}
        `;

    } catch (err) {

        console.error(err);

        error.textContent =
            err.message ||
            "Could not analyze the image.";

    } finally {

        loading.style.display =
            "none";
    }
}

</script>
