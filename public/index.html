<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenCV Image Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .upload-area {
            border: 2px dashed #bbb;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #preview {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 8px;
        }

        .error {
            color: #c62828;
            margin-top: 15px;
        }

        .loading {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>OpenCV Image Analyzer</h1>

    <p>
        Upload an image to detect faces and eyes.
    </p>

    <div class="upload-area">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <br><br>

        <button onclick="analyzeImage()">
            Analyze Image
        </button>

    </div>

    <div
        class="loading"
        id="loading">
        Analyzing image...
    </div>

    <div
        class="error"
        id="error">
    </div>

    <div
        class="stats"
        id="stats">
    </div>

    <img
        id="preview"
        style="display:none;"
        alt="Analyzed image"
    >

</div>

<script>

async function analyzeImage() {

    const input =
        document.getElementById("imageInput");

    const error =
        document.getElementById("error");

    const loading =
        document.getElementById("loading");

    const stats =
        document.getElementById("stats");

    const preview =
        document.getElementById("preview");

    error.textContent = "";

    stats.innerHTML = "";

    if (!input.files.length) {

        error.textContent =
            "Please select an image.";

        return;
    }

    loading.style.display = "block";

    try {

        const formData =
            new FormData();

        formData.append(
            "image",
            input.files[0]
        );

        const response =
            await fetch(
                "/api/analyze",
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok || data.error) {

            throw new Error(
                data.error ||
                "OpenCV server returned an error."
            );
        }

        preview.src =
            "data:image/jpeg;base64," +
            data.image;

        preview.style.display =
            "block";

        stats.innerHTML = `
            <strong>Faces detected:</strong>
            ${data.faces_detected}
            <br>
            <strong>Eyes detected:</strong>
            ${data.eyes_detected}
        `;

    } catch (err) {

        console.error(err);

        error.textContent =
            err.message ||
            "Could not analyze the image.";

    } finally {

        loading.style.display =
            "none";
    }
}

</script>

</body>
</html>
