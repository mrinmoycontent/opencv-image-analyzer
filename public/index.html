<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenCV Image Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .upload-area {
            border: 2px dashed #bbb;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #preview {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 8px;
        }

        .error {
            color: #c62828;
            margin-top: 15px;
        }

        .loading {
            display: none;
            margin-top: 15px;
        }
    </style>

    <!-- Official MediaPipe Tasks Vision browser bundle -->
    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
        crossorigin="anonymous">
    </script>
</head>

<body>

<div class="container">

    <h1>OpenCV Image Analyzer</h1>

    <p>
        Upload an image to detect faces and eyes.
    </p>

    <div class="upload-area">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <br><br>

        <button id="analyzeButton">
            Analyze Image
        </button>

    </div>

    <div
        class="loading"
        id="loading">
        Analyzing image...
    </div>

    <div
        class="error"
        id="error">
    </div>

    <div
        class="stats"
        id="stats">
    </div>

    <img
        id="preview"
        style="display:none;"
        alt="Analyzed image"
    >

</div>

<script type="module">

const {
    FaceLandmarker,
    FilesetResolver
} = await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
);

let faceLandmarker = null;


/*
 * Initialize MediaPipe Face Landmarker
 */
async function initializeFaceLandmarker() {

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
        );

    faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
                },

                runningMode: "IMAGE",

                numFaces: 10,

                minFaceDetectionConfidence: 0.3,

                minFacePresenceConfidence: 0.3,

                minTrackingConfidence: 0.3
            }
        );

    console.log(
        "MediaPipe Face Landmarker ready"
    );
}


/*
 * Find the bounding box for
 * a group of landmarks.
 */
function getEyeBox(
    landmarks,
    indexes,
    width,
    height
) {

    const points = indexes.map(
        index => {

            const landmark =
                landmarks[index];

            return {
                x: landmark.x * width,
                y: landmark.y * height
            };
        }
    );

    const xs =
        points.map(point => point.x);

    const ys =
        points.map(point => point.y);

    let minX =
        Math.min(...xs);

    let maxX =
        Math.max(...xs);

    let minY =
        Math.min(...ys);

    let maxY =
        Math.max(...ys);

    const paddingX =
        Math.max(
            8,
            (maxX - minX) * 0.8
        );

    const paddingY =
        Math.max(
            6,
            (maxY - minY) * 1.2
        );

    minX -= paddingX;
    maxX += paddingX;

    minY -= paddingY;
    maxY += paddingY;

    return {
        x: minX,
        y: minY,
        width: maxX - minX,
        height: maxY - minY
    };
}


/*
 * Analyze image
 */
async function analyzeImage() {

    const input =
        document.getElementById(
            "imageInput"
        );

    const error =
        document.getElementById(
            "error"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const stats =
        document.getElementById(
            "stats"
        );

    const preview =
        document.getElementById(
            "preview"
        );

    error.textContent = "";

    stats.innerHTML = "";

    if (!input.files.length) {

        error.textContent =
            "Please select an image.";

        return;
    }

    if (!faceLandmarker) {

        error.textContent =
            "Face detection model is still loading. Please wait a moment and try again.";

        return;
    }

    loading.style.display =
        "block";

    try {

        /*
         * Send image to OpenCV backend.
         */
        const formData =
            new FormData();

        formData.append(
            "image",
            input.files[0]
        );

        const response =
            await fetch(
                "/api/analyze",
                {
                    method: "POST",
                    body: formData
                }
            );

        if (!response.ok) {

            throw new Error(
                "OpenCV server returned an error."
            );
        }

        const data =
            await response.json();

        if (data.error) {

            throw new Error(
                data.error
            );
        }


        /*
         * Load original image.
         */
        const image =
            new Image();

        image.onload = function () {

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width =
                image.naturalWidth;

            canvas.height =
                image.naturalHeight;

            const ctx =
                canvas.getContext(
                    "2d"
                );

            /*
             * Draw original image.
             */
            ctx.drawImage(
                image,
                0,
                0
            );


            /*
             * Run Face Landmarker.
             */
            const result =
                faceLandmarker.detect(
                    image
                );

            let eyesDetected = 0;


            /*
             * Official MediaPipe eye
             * landmark groups.
             *
             * These are landmark points
             * around the actual eye contours.
             */
            const leftEyeIndexes = [
                33,
                133,
                159,
                145
            ];

            const rightEyeIndexes = [
                362,
                263,
                386,
                374
            ];


            if (
                result.faceLandmarks &&
                result.faceLandmarks.length > 0
            ) {

                for (
                    const landmarks
                    of result.faceLandmarks
                ) {

                    /*
                     * Left eye
                     */
                    const leftBox =
                        getEyeBox(
                            landmarks,
                            leftEyeIndexes,
                            canvas.width,
                            canvas.height
                        );

                    /*
                     * Right eye
                     */
                    const rightBox =
                        getEyeBox(
                            landmarks,
                            rightEyeIndexes,
                            canvas.width,
                            canvas.height
                        );


                    /*
                     * Draw left eye box
                     */
                    ctx.strokeStyle =
                        "#0066ff";

                    ctx.lineWidth = 3;

                    ctx.strokeRect(
                        leftBox.x,
                        leftBox.y,
                        leftBox.width,
                        leftBox.height
                    );


                    /*
                     * Draw right eye box
                     */
                    ctx.strokeRect(
                        rightBox.x,
                        rightBox.y,
                        rightBox.width,
                        rightBox.height
                    );


                    eyesDetected += 2;
                }
            }


            /*
             * Show final image.
             */
            preview.src =
                canvas.toDataURL(
                    "image/jpeg",
                    0.92
                );

            preview.style.display =
                "block";


            /*
             * Statistics.
             */
            stats.innerHTML = `
                <strong>Faces detected:</strong>
                ${data.faces_detected}
                <br>
                <strong>Eyes detected:</strong>
                ${eyesDetected}
            `;

            loading.style.display =
                "none";
        };


        image.onerror =
            function() {

                throw new Error(
                    "Could not load image."
                );
            };


        image.src =
            URL.createObjectURL(
                input.files[0]
            );

    } catch (err) {

        console.error(err);

        error.textContent =
            err.message ||
            "Could not analyze the image.";

        loading.style.display =
            "none";
    }
}


/*
 * Button
 */
document
    .getElementById(
        "analyzeButton"
    )
    .addEventListener(
        "click",
        analyzeImage
    );


/*
 * Initialize model.
 */
try {

    await initializeFaceLandmarker();

    console.log(
        "Face detection model loaded successfully."
    );

} catch (error) {

    console.error(
        "MediaPipe initialization failed:",
        error
    );

    document.getElementById(
        "error"
    ).textContent =
        "Face detection model could not be loaded. Check the browser console for details.";
}

</script>

</body>
</html>
